[package]
name = "jam-tools"
version = "1.0.0"
edition = "2024"
repository = "https://github.com/St4NNi/jam-rs"
license = "MIT"

[[bin]]
name = "avalanche"
path = "avalanche.rs"

[[bin]]
name = "constants"
path = "constants.rs"

[dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
murmurhash3 = { version = "0.0.5" }
fastmurmur3 = "0.2.0"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
roaring = "0.11.2"
rand = "0.9.2"
jam-rs = { path = "../" }
rayon = "1.10.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
