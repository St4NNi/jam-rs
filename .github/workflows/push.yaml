name: test_build_push
on: push
jobs:
  build: # This does not build the whole proto files for production, it tests if rust / tonic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust module layout
        run: |
          while IFS= read -r dir; do
            count=$(find "$dir" -maxdepth 1 -type f -name '*.rs' ! -name mod.rs ! -name '*test*.rs' | wc -l)
            (( count >= 5 )) || { echo "$dir has only $count implementation files"; exit 1; }
          done < <(find src -type f -name mod.rs -printf '%h\n')
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
