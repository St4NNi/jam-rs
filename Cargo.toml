[package]
name = "jam-rs"
version = "0.9.11"
edition = "2024"
repository = "https://github.com/St4NNi/jam-rs"
license = "MIT"
authors = ["Sebastian Beyvers <sebastian.beyvers@cb.jlug.de>"]
description = "Just another (genomic) minhash (Jam) implementation in Rust"
keywords = [
    "minhash",
    "metagenomics",
    "bioinformatics",
    "containment",
    "jaccard",
]
categories = ["command-line-utilities", "science", "algorithms"]
exclude = ["/tests"]
readme = "README.md"


[[bin]]
name = "jam"
path = "src/main.rs"

[[bench]]
name = "trace"
harness = false

[lib]
name = "jam_rs"
path = "src/lib.rs"

[features]
bench-internals = []

[dependencies]
anyhow = "1.0.102"
dashmap = "6.1.0"
jamhash = "0.1.2"
needletail = { version = "0.6.3", features = [
    "flate2",
    "bzip2",
    "xz2",
    "zstd",
] }
rayon = "1.11.0"
rust-s3 = { version = "0.37.2", default-features = false, features = ["fail-on-err", "sync-rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
clap = { version = "4.5.60", features = ["derive"] }
tempfile = "3.25.0"
crossfire = "3.1.3"
bytemuck = { version = "1.25.0", features = ["derive"] }
memmap2 = "0.9.10"
noodles-bgzf = "0.47.0"
unsigned-varint = "=0.8.0"
xorf = { version = "=0.12.0", default-features = false, features = ["binary-fuse", "serde"] }
thiserror = "2"
indicatif = "0.18.4"
statrs = "0.18"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
