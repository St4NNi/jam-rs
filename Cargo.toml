[package]
name = "jam-rs"
version = "0.11.0"
edition = "2024"
repository = "https://github.com/St4NNi/jam-rs"
license = "MIT"
authors = ["Sebastian Beyvers <sebastian.beyvers@cb.jlug.de>"]
description = "Just another minimizer (jam): find and align small sequences in very large assembly sets"
keywords = ["minimizer", "alignment", "metagenomics", "bioinformatics", "search"]
categories = ["command-line-utilities", "science", "algorithms"]
exclude = ["/tests"]
readme = "README.md"


[[bin]]
name = "jam"
path = "src/main.rs"

[lib]
name = "jam_rs"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
jamhash = "0.1.2"
needletail = { version = "0.6.3", features = [
    "flate2",
    "bzip2",
    "xz2",
    "zstd",
] }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5.60", features = ["derive"] }
tempfile = "3.25.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
memmap2 = "0.9.10"
thiserror = "2"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
