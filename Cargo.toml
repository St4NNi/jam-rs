[package]
name = "jam-rs"
version = "1.0.0"
edition = "2024"
repository = "https://github.com/St4NNi/jam-rs"
license = "MIT"
authors = ["Sebastian Beyvers <sebastian.beyvers@cb.jlug.de>"]
description = "Just another (genomic) minhash (Jam) implementation in Rust"
keywords = [
    "minhash",
    "metagenomics",
    "bioinformatics",
    "containment",
    "jaccard",
]
categories = ["command-line-utilities", "science", "algorithms"]
exclude = ["/tests"]
readme = "README.md"


[[bin]]
name = "jam"
path = "src/main.rs"

[lib]
name = "jam_rs"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.98"
jamhash = "0.1.2"
needletail = "0.6.3"
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
clap = { version = "4.5.42", features = ["derive"] }
itertools = "0.14.0"
heed = "0.22.0"
byteorder = "1.5.0"
integer-encoding = "4.0.2"
indicatif = { version = "0.18.0", features = ["rayon"] }
tempfile = "3.20.0"
crossbeam-channel = "0.5.15"
serde_json = "1.0.142"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
jamhash = "0.1.2"
murmurhash3 = { version = "0.0.5" }
fastmurmur3 = "0.2.0"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
roaring = "0.11.2"
rand = "0.9.2"
foldhash = "0.1.5"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
