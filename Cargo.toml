# The jam-rs package: dependencies, the jam binary and build profiles.
# Copyright (c) 2023-2026 Sebastian Beyvers
# SPDX-License-Identifier: MIT
[package]
name = "jam-rs"
version = "0.11.0"
edition = "2024"
repository = "https://github.com/St4NNi/jam-rs"
license = "MIT"
authors = ["Sebastian Beyvers <sebastian.beyvers@cb.jlug.de>"]
description = "Just another minimizer (jam): find and align small sequences in very large assembly sets"
keywords = ["minimizer", "alignment", "metagenomics", "bioinformatics", "search"]
categories = ["command-line-utilities", "science", "algorithms"]
exclude = ["/tests"]
readme = "README.md"


[[bin]]
name = "jam"
path = "src/main.rs"

[lib]
name = "jam_rs"
path = "src/lib.rs"

[dependencies]
jamhash = "0.1.3"
needletail = { version = "0.6.3", features = [
    "flate2",
    "bzip2",
    "xz2",
    "zstd",
] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
memmap2 = "0.9.12"
thiserror = "2.0.21"
sha2 = "0.10.9"
libc = "0.2.191"
crc32fast = "1.5.3"
flate2 = "1.1.10"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
opendal = { version = "0.59.5", default-features = false, features = [
    "services-s3",
    "http-transport-reqwest",
    "executors-tokio",
    "layers-concurrent-limit",
    "layers-retry",
    "layers-timeout",
] }
foyer = "0.22.6"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6.1"

# Tests run the alignment kernel; unoptimized it is about fifty times slower.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
rand = "0.10.3"
